name: Deploy the NovelForge website to GitHub Pages

# site/ is the project's public website - plain static HTML/CSS. It is generated
# from tools/site/ by tools/build_site.py and the output is committed, so there
# is nothing to build here. This publishes only that folder: the desktop app's
# Python code and the unfinished web/ redesign never leave the repo.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
